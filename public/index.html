<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <title>CodePreview</title>
    <link rel="stylesheet" href="/styles.css?v=viewer-controls-top-1" />
  </head>
  <body class="viewer-page">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <div class="rotate-notice" role="status">
      <div class="phone-rotate" aria-hidden="true"></div>
      <strong>请将手机横屏</strong>
      <span>横屏后可以获得更宽阔的代码阅读空间</span>
    </div>

    <div class="viewer-shell">
      <header class="viewer-header">
        <button class="icon-button" id="library-button" type="button" aria-label="打开代码库">☰</button>
        <div class="viewer-heading">
          <div class="eyebrow">CODE PREVIEW</div>
          <h1 id="viewer-title">选择一段代码</h1>
        </div>
        <span class="language-badge is-hidden" id="viewer-language"></span>
        <nav class="viewer-controls" aria-label="代码播放控制">
          <button class="control icon-control secondary" id="reset-button" type="button" aria-label="重置" title="重置">↻</button>
          <button class="control icon-control" id="previous-button" type="button" aria-label="上一行" title="上一行">←</button>
          <button class="control icon-control primary" id="play-button" type="button" aria-label="自动播放" title="播放或暂停"><span id="play-icon">▶</span></button>
          <button class="control icon-control" id="next-button" type="button" aria-label="下一行" title="下一行">→</button>
          <label class="speed-control" aria-label="播放速度" title="播放速度">
            <span class="speed-icon" aria-hidden="true">◷</span>
            <select id="speed-select" aria-label="播放速度">
              <option value="3000">0.6×</option>
              <option value="1800" selected>1×</option>
              <option value="900">2×</option>
            </select>
          </label>
        </nav>
      </header>

      <main class="code-workspace">
        <section class="code-panel" id="code-panel" aria-live="polite">
          <div class="code-panel-topline">
            <div class="window-dots" aria-hidden="true"><i></i><i></i><i></i></div>
            <p id="viewer-description">从代码库中选择内容后，就可以逐行开始复习。</p>
            <span id="line-counter">0 / 0</span>
          </div>
          <div class="code-scroll" id="code-scroll">
            <ol class="code-lines" id="code-lines"></ol>
            <div class="empty-code" id="empty-code">
              <span>&lt;/&gt;</span>
              <strong>还没有可显示的代码</strong>
              <p>请先添加目录和代码。</p>
            </div>
          </div>
          <div class="progress-track" aria-hidden="true"><div id="progress-fill"></div></div>
        </section>

      </main>
    </div>

    <div class="drawer-backdrop" id="drawer-backdrop"></div>
    <aside class="library-drawer" id="library-drawer" aria-hidden="true">
      <div class="drawer-header">
        <button class="icon-button drawer-back is-hidden" id="directory-back-button" type="button" aria-label="返回目录">←</button>
        <div class="drawer-heading"><span class="eyebrow" id="drawer-eyebrow">DIRECTORIES</span><h2 id="drawer-title">目录</h2></div>
        <button class="icon-button" id="close-library-button" type="button" aria-label="关闭代码库">×</button>
      </div>
      <div class="library-list" id="library-list"></div>
    </aside>

    <div class="toast" id="toast" role="status"></div>
    <script src="/viewer.js?v=viewer-controls-top-1" defer></script>
  </body>
</html>
