<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f1e8" />
    <title>CodePreview 管理</title>
    <link rel="stylesheet" href="/styles.css?v=admin-drag-sort-1" />
  </head>
  <body class="admin-page">
    <header class="admin-topbar">
      <a class="brand" href="/"><span class="brand-mark">C</span><span><strong>CodePreview</strong><small>代码管理</small></span></a>
      <div class="admin-topbar-actions">
        <span class="save-state" id="save-state">数据保存在 JSON 文件中</span>
        <a class="preview-link" id="preview-link" href="/" target="_blank" rel="noreferrer">打开手机预览 ↗</a>
      </div>
    </header>

    <main class="admin-layout">
      <aside class="admin-sidebar">
        <div class="sidebar-title">
          <div><span class="eyebrow dark">DIRECTORIES</span><h1>目录</h1></div>
          <div class="sidebar-title-actions">
            <button class="sort-mode-button" id="directory-sort-button" type="button">⇅ 排序</button>
            <button class="add-button" id="add-directory-button" type="button">＋ 新建</button>
          </div>
        </div>
        <p class="sidebar-hint">选择目录后管理其中的代码，点击排序后可直接拖动调整顺序。</p>
        <div class="directory-admin-list" id="directory-list"></div>
        <div class="code-list-heading">
          <div><span class="eyebrow dark">CODE LIBRARY</span><h2 id="code-list-title">代码库</h2></div>
          <div class="code-list-actions">
            <button class="sort-mode-button" id="snippet-sort-button" type="button" disabled>⇅ 排序</button>
            <button class="add-code-button" id="add-button" type="button" disabled>＋ 代码</button>
          </div>
        </div>
        <div class="admin-list" id="admin-list"></div>
      </aside>

      <section class="editor-card">
        <div class="editor-empty" id="editor-empty">
          <span>&lt;/&gt;</span>
          <h2 id="empty-title">请先创建一个目录</h2>
          <p id="empty-description">目录创建完成后，才能在目录下面添加代码。</p>
          <button class="add-button large" id="empty-add-button" type="button">新建目录</button>
        </div>

        <form class="editor-form is-hidden" id="editor-form">
          <div class="editor-title-row">
            <div><span class="eyebrow dark">EDITOR</span><h2 id="editor-heading">编辑代码</h2></div>
            <div class="editor-actions">
              <button class="danger-button" id="delete-button" type="button">删除</button>
              <button class="save-button" type="submit">保存更改</button>
            </div>
          </div>

          <div class="form-grid">
            <label class="field field-wide">代码标题 <span>*</span>
              <input id="title-input" name="title" maxlength="100" required placeholder="例如：PyTorch 训练循环" />
            </label>
            <label class="field">所属目录 <span>*</span>
              <select id="directory-input" name="directoryId" required></select>
            </label>
            <label class="field">语言标签
              <input id="language-input" name="language" maxlength="30" placeholder="例如：Python" />
            </label>
            <label class="field field-wide">简短说明
              <input id="description-input" name="description" maxlength="500" placeholder="这段代码用于……" />
            </label>
          </div>

          <label class="field code-field">代码内容
            <div class="textarea-toolbar"><span>每个换行对应手机端的一步</span><span id="line-count">0 行</span></div>
            <textarea id="code-input" name="code" maxlength="200000" spellcheck="false" placeholder="在这里粘贴代码……"></textarea>
          </label>
        </form>
      </section>
    </main>

    <dialog class="move-dialog" id="move-dialog">
      <form class="move-dialog-form" id="move-form">
        <div><span class="eyebrow dark">MOVE CODE</span><h2>移动代码库</h2></div>
        <p id="move-description">选择要移动到的目标目录。</p>
        <label class="field">目标目录 <span>*</span>
          <select id="move-directory-select" required></select>
        </label>
        <div class="move-dialog-actions">
          <button class="dialog-cancel-button" id="cancel-move-button" type="button">取消</button>
          <button class="save-button" id="confirm-move-button" type="submit">确认移动</button>
        </div>
      </form>
    </dialog>

    <div class="toast light" id="toast" role="status"></div>
    <script src="/admin.js?v=admin-drag-sort-1" defer></script>
  </body>
</html>
